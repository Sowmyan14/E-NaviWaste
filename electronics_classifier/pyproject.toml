[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "electronics-classifier"
version = "0.1.0"
description = "Image-only household electronics classifier with a modular, config-driven pipeline."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "Pillow",
    "pydantic>=2",
    "pyyaml",
    "supervision",
]

[project.optional-dependencies]
# Grounding DINO alone (the `baseline` preset)
dino = ["transformers", "torch"]
# default pipeline: RAM++ tags + Grounding DINO boxes + Hugging Face SAM masks.
# `ram` (the recognize-anything repo) is only on GitHub, so this extra cannot be published to PyPI
# as is. Its package name is `ram`, and it declares no dependencies, so timm and fairscale are
# listed here (unpinned: its requirements.txt pins versions that no longer install).
grounded = [
    "transformers",
    "torch",
    "torchvision",
    "timm",
    "fairscale",
    "ram @ git+https://github.com/xinyu1205/recognize-anything.git",
]
vlm = ["transformers", "torch", "torchvision", "qwen-vl-utils"]
# VLM through an OpenAI-compatible server: LM Studio, Ollama (local or cloud), vLLM, ...
server = ["openai"]
# read iPhone HEIC/HEIF photos (Pillow cannot decode them on its own)
heic = ["pillow-heif"]
# OCR cross-check of VLM model names (the ocr_verify_model post-processor)
ocr = ["rapidocr", "onnxruntime", "rapidfuzz"]
sam = ["segment-anything"]
sam2 = ["sam2"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "src"]
addopts = "-m 'not slow'"
filterwarnings = [
    # supervision's own deprecation notice on import; not actionable here
    "ignore:.*template_mgs.*:FutureWarning",
]
markers = [
    "slow: runs real models and needs weights/photos; skipped by default",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
