run:
  device: auto
  seed: 0

vocabulary:
  categories:            # "electronic device" is always appended if missing
    - router
    - modem
    - power strip
    - charger
    - smart speaker
    - laptop
    - tablet
    - smartphone
    - remote control
    - game console
    - monitor
    - television
    - webcam
    - usb hub
    - cable
    - appliance
    - electronic device

pipeline:
  image_preprocess:                       # applied in order, before the detector
    - {name: ensure_rgb_uint8}
    - {name: resize_max_side, params: {max_side: 1280}}

  # RAM++ tags the photo, Grounding DINO boxes the tags, hf_sam (below) masks the boxes.
  # The previous vocabulary-prompted pipeline is kept as `--preset baseline`.
  detector:
    name: ram_grounding_dino
    params:
      ram_checkpoint: "checkpoints/ram_plus_swin_large_14m.pth"   # download it first (see README)
      model_id: "IDEA-Research/grounding-dino-tiny"
      raw_box_threshold: 0.25             # floor; real thresholding happens in detection_filters
      raw_text_threshold: 0.2
      max_prompt_tokens: 256              # the tag list is chunked into several prompts above this
      include_vocabulary: true            # also prompt with vocabulary.categories

  detection_filters:                      # applied in order; reorder/remove/add freely
    - {name: score_threshold,  params: {min_score: 0.25}}
    - {name: min_size,         params: {min_width_px: 32, min_height_px: 32}}
    - {name: min_area_ratio,   params: {min_ratio: 0.02}}    # drops edge slivers and background scraps
    - {name: full_frame_guard, params: {min_ratio: 0.90}}    # whole-photo boxes must not swallow real ones
    - {name: nms,              params: {iou_threshold: 0.50, class_agnostic: true}}
    - {name: containment,      params: {min_containment: 0.90}}   # drop parts (lens, label) inside a device box
    - {name: top_k,            params: {k: 20}}

  segmenter: {name: hf_sam, params: {model_id: "facebook/sam-vit-base"}}   # or: none, sam, sam2
  segmentation_gate: {name: always}       # only consulted when segmenter != none

  crop:
    padding_ratio: 0.12                   # per side, relative to box w/h
    include_full_image_context: true
    max_image_side_px: 1024               # downscale limit for crop and context sent to the VLM

  crop_transforms:                        # applied to the crop before the VLM
    - {name: identity}

  vlm:
    client: {name: openai_compatible, params: {base_url: "http://localhost:11434/v1", model: "qwen3-vl:8b-instruct", temperature: 0.0, max_tokens: 256}}   # local Ollama
    max_retries: 1
    system_prompt_file: config/prompts/vlm_validate_prompt.txt   # null = built-in prompt; else a template with {categories}
    on_not_electronic: drop               # drop | warn: what to do with an item the VLM says is not a device

  attribute_postprocess:
    - {name: normalize_unknown, params: {max_len: 64}}
    - {name: ocr_verify_model}            # model names are kept only if OCR can read them (loaded lazily)
    - {name: category_open, params: {max_len: 48, max_words: 4}}   # novel category kept + CATEGORY_NOVEL

  warning_rules:
    - {name: unknown_field}               # BRAND_UNKNOWN / MODEL_UNKNOWN / COLOR_UNKNOWN
    - {name: low_detector_confidence, params: {threshold: 0.40}}
    - {name: small_crop,              params: {min_side_px: 64}}
    - {name: overlap,                 params: {iou: 0.15}}
    - {name: category_mismatch}           # detector phrase vs VLM category disagree

rendering:
  output_format: png                      # png | jpeg
  label_template: "{id} {category} | {brand} {model} | {color} | {confidence:.2f}"
  stroke_scale: 1.0
  font_scale: 1.0
  mask_alpha: 0.35
